      // Helpers de persistência LocalStorage
      const STORAGE_KEY = 'portal_escolar_exec_v2';
      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {
          console.warn('Erro ao carregar dados:', e);
        }
        return {
          users: INITIAL_USERS,
          classes: INITIAL_CLASSES,
          students: INITIAL_STUDENTS,
          reports: INITIAL_REPORTS,
          schoolConfig: INITIAL_SCHOOL_CONFIG,
          notifications: [
            { id: 'notif-1', title: 'Pré-Conselho Aberto', message: 'Votação do 1º Bimestre liberada com perguntas 100% objetivas.', isRead: false, date: '2026-03-24' }
          ],
        };
      }

      function saveData(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.warn('Erro ao salvar dados:', e);
        }
      }

      // ==========================================
      // APLICAÇÃO PRINCIPAL (APP CONTAINER)
      // ==========================================
      function App() {
        const [appData, setAppData] = useState(loadData);
        const [currentUser, setCurrentUser] = useState(null);
        const [showNotifModal, setShowNotifModal] = useState(false);

        // Limpeza de sessão para obrigar senha a cada carregamento
        useEffect(() => {
          try {
            sessionStorage.clear();
            localStorage.removeItem('portal_escolar_current_user_v1');
            localStorage.removeItem('portal_escolar_session_user');
          } catch (e) {}
        }, []);

        useEffect(() => {
          saveData(appData);
        }, [appData]);

        const handleLogin = (user) => setCurrentUser(user);
        const handleLogout = () => {
          try {
            sessionStorage.clear();
          } catch (e) {}
          setCurrentUser(null);
        };

        const handleSaveReport = (reportPayload) => {
          setAppData((prev) => {
            const idx = prev.reports.findIndex(
              (r) => r.classId === reportPayload.classId && r.teacherId === reportPayload.teacherId
            );
            let nextReports;
            const updatedItem = {
              ...reportPayload,
              submittedAt: new Date().toLocaleString('pt-BR'),
              updatedAt: new Date().toISOString(),
            };
            if (idx >= 0) {
              nextReports = [...prev.reports];
              nextReports[idx] = { ...nextReports[idx], ...updatedItem };
            } else {
              nextReports = [
                { ...updatedItem, id: 'rep-' + Date.now(), createdAt: new Date().toISOString() },
                ...prev.reports,
              ];
            }
            return { ...prev, reports: nextReports };
          });
        };

        const handleToggleStar = (studentId) => {
          setAppData((prev) => ({
            ...prev,
            students: prev.students.map((st) => {
              if (st.id === studentId) {
                const nextVal = !st.isStar;
                return {
                  ...st,
                  isStar: nextVal,
                  starReason: nextVal ? 'Destaque acadêmico e comportamental reconhecido pelo conselho.' : undefined,
                  starCategory: nextVal ? 'academic' : undefined,
                };
              }
              return st;
            }),
          }));
        };

        const handleSendReminder = (teacherName, className) => {
          setAppData((prev) => ({
            ...prev,
            notifications: [
              {
                id: 'notif-' + Date.now(),
                title: 'Lembrete de Votação',
                message: `Prezado(a) ${teacherName}, solicitamos a conclusão do pré-conselho da turma ${className}.`,
                date: new Date().toISOString().split('T')[0],
                isRead: false,
              },
              ...prev.notifications,
            ],
          }));
          alert(`Notificação e cobrança de prazo enviadas com sucesso para ${teacherName}!`);
        };

        const handleDownloadStandaloneHtml = () => {
          const htmlContent = '<!doctype html>\n' + document.documentElement.outerHTML;
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'pre_conselho_escolar_autonomo.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };

        if (!currentUser) {
          return (
            <LoginView
              users={appData.users}
              schoolConfig={appData.schoolConfig}
              onLogin={handleLogin}
              onDownloadHtml={handleDownloadStandaloneHtml}
            />
          );
        }

        return (

                        {appData.schoolConfig.name}
                      </h1>
                    </div>
                  </div>

                  {/* Ações e Usuário */}
                  <div className="flex items-center space-x-3 shrink-0">
                    {/* Botão Baixar HTML Autônomo */}
                    <button
                      type="button"
                      onClick={handleDownloadStandaloneHtml}
                      className="hidden md:inline-flex items-center gap-1.5 py-1.5 px-3 rounded-lg bg-navy-850 hover:bg-navy-800 border border-navy-700 text-xs font-bold text-white transition-all cursor-pointer"
                      title="Baixar arquivo HTML único para executar em qualquer navegador offline"
                    >
                      <IconDownload className="w-3.5 h-3.5 text-blue-300" />
                      <span>Salvar HTML Local</span>
                    </button>

                    {/* Notificações */}
                    <button
                      type="button"
                      onClick={() => setShowNotifModal(true)}
                      className="relative p-2 rounded-lg bg-navy-850 hover:bg-navy-800 border border-navy-700 text-slate-300 hover:text-white transition-colors cursor-pointer"
                      title="Avisos do Conselho"
                    >
                      <IconBell className="w-4 h-4" />
                      {appData.notifications.filter((n) => !n.isRead).length > 0 && (
                        <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full ring-2 ring-obsidian-950" />
                      )}
                    </button>

                    {/* Perfil Atual */}
                    <div className="flex items-center gap-2.5 pl-3 border-l border-navy-750">
                      <div className={'w-8 h-8 rounded-lg flex items-center justify-center font-black text-xs shrink-0 shadow-sm ' +
                        (currentUser.role === 'admin' ? 'bg-white text-navy-950' : 'bg-navy-800 border border-navy-700 text-white')
                      }>
                        {currentUser.name.charAt(0)}
                      </div>
                      <div className="hidden sm:block text-left text-xs leading-tight">

                            <span className="text-blue-300">{currentUser.subject}</span>
                          )}
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={handleLogout}
                        className="p-1.5 text-slate-400 hover:text-red-400 rounded-lg hover:bg-navy-850 transition-colors cursor-pointer ml-1"
                        title="Sair do sistema"
                      >
                        <IconLogOut className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </header>

            {/* Conteúdo Principal */}
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
              {currentUser.role === 'admin' ? (
                <AdminDashboard
                  currentUser={currentUser}
                  data={appData}
                  onSendReminder={handleSendReminder}
                  onToggleStar={handleToggleStar}
                  onDownloadHtml={handleDownloadStandaloneHtml}
                />
              ) : (
                <TeacherDashboard
                  currentUser={currentUser}
                  data={appData}
                  onSaveReport={handleSaveReport}
                  onToggleStar={handleToggleStar}
                />
              )}
            </main>

            {/* Notificações Modal */}
            {showNotifModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian-950/80 backdrop-blur-xs">
                <div className="bg-navy-850 border border-navy-700 rounded-2xl max-w-md w-full p-5 shadow-2xl">
                  <div className="flex items-center justify-between pb-3 border-b border-navy-750">
                    <div className="flex items-center gap-2">
                      <IconBell className="w-4 h-4 text-white" />
                      <h3 className="text-sm font-black text-white uppercase tracking-wider">Avisos e Lembretes</h3>
                    </div>
                    <button
                      type="button"
                      onClick={() => setShowNotifModal(false)}
                      className="text-slate-400 hover:text-white text-xs font-bold px-2 py-1 bg-navy-800 rounded"
                    >
                      Fechar
                    </button>
                  </div>
                  <div className="divide-y divide-navy-750 mt-3 max-h-72 overflow-y-auto">
                    {appData.notifications.map((n) => (
                      <div key={n.id} className="py-2.5 text-xs">
                        <div className="font-bold text-white flex justify-between">
                          <span>{n.title}</span>
                          <span className="text-[10px] text-slate-400">{n.date}</span>
                        </div>
                        <p className="text-slate-300 mt-1">{n.message}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ==========================================
      // TELA DE LOGIN EXECUTIVA (NAVY 75% / PRETO 20% / BRANCO 5%)
      // ==========================================
      function LoginView({ users, schoolConfig, onLogin, onDownloadHtml }) {
        const [identifier, setIdentifier] = useState('');
        const [password, setPassword] = useState('');
        const [showPassword, setShowPassword] = useState(false);
        const [error, setError] = useState('');
        const [isLoading, setIsLoading] = useState(false);

        const cleanId = identifier.trim().toLowerCase();
        const matched = cleanId
          ? users.find(
              (u) =>
                u.username.toLowerCase() === cleanId ||
                u.email.toLowerCase() === cleanId ||
                u.name.toLowerCase() === cleanId ||
                u.name.toLowerCase().includes(cleanId)
            )
          : null;

        const handleSubmit = (e) => {
          e.preventDefault();
          setError('');

          const cleanInput = identifier.trim().toLowerCase();
          if (!cleanInput) {
            setError('Por favor, informe seu usuário ou e-mail institucional.');
            return;
          }

          if (!password.trim()) {
            setError('Senha obrigatória! Digite a senha de acesso (padrão do sistema: 123456).');
            return;
          }

          const foundUser = users.find(
            (u) =>
              u.username.toLowerCase() === cleanInput ||
              u.email.toLowerCase() === cleanInput ||
              u.name.toLowerCase() === cleanInput ||
              u.name.toLowerCase().includes(cleanInput)
          );

          if (!foundUser) {
            setError('Usuário não localizado no quadro docente ou diretivo.');
            return;
          }

          const expectedPass = foundUser.password || '123456';
          if (password !== expectedPass) {
            setError('Senha incorreta! Utilize a senha cadastrada (padrão: 123456).');
            return;
          }

          setIsLoading(true);
          setTimeout(() => {
            onLogin(foundUser);
          }, 100);
        };

        const handlePickUser = (u) => {
          setIdentifier(u.username);
          setPassword('');
          setError('');
          const passEl = document.getElementById('login-password-field');
          if (passEl) passEl.focus();
        };

        return (
          <div className="min-h-screen flex flex-col justify-between items-center px-4 py-8 bg-navy-900 text-slate-100">
            {/* Barra Superior / Download Standalone */}
            <div className="w-full max-w-xl flex items-center justify-between mb-4">
              <div className="flex items-center gap-2 text-xs font-extrabold text-white">
                <div className="w-7 h-7 rounded-lg bg-obsidian-950 border border-navy-750 flex items-center justify-center shadow-xs">
                  <IconGraduation className="w-4 h-4 text-white" />
                </div>
                <span>SIGEC · Sistema Integrado de Pré-Conselho</span>
              </div>
              <button
                type="button"
                onClick={onDownloadHtml}
                className="py-1.5 px-3 bg-navy-850 hover:bg-navy-800 border border-navy-700 text-white text-xs font-bold rounded-lg flex items-center gap-1.5 cursor-pointer transition-all shadow-xs"
                title="Salvar arquivo HTML autônomo para abrir direto no navegador"
              >
                <IconDownload className="w-3.5 h-3.5 text-blue-300" />
                <span>Baixar HTML (.html)</span>
              </button>
            </div>

            {/* Card Principal de Login */}
            <div className="w-full max-w-xl space-y-4">
              <div className="bg-obsidian-950 rounded-2xl border border-navy-750 p-6 sm:p-8 shadow-2xl relative overflow-hidden">
                {/* Linha de acento executivo */}
                <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-500 via-white to-blue-500" />

                {/* Cabeçalho */}
                <div className="text-center mb-6">
                  <div className="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-navy-850 border border-navy-700 text-white shadow-md mb-3">
                    <IconShield className="w-7 h-7 text-white" />
                  </div>
                  <h1 className="text-lg sm:text-xl font-black text-white tracking-tight leading-snug">
                    {schoolConfig.name}
                  </h1>
                  <p className="text-xs text-slate-400 mt-1 font-semibold uppercase tracking-wider">
                    {schoolConfig.subtitle} · <strong className="text-blue-300">{schoolConfig.period}</strong>
                  </p>
                  <div className="inline-flex items-center gap-1.5 mt-2.5 px-3 py-1 rounded-full bg-navy-850 border border-navy-700 text-xs font-bold text-slate-200">
                    <IconLock className="w-3.5 h-3.5 text-white" />
                    <span>Votação Sigilosa e Auditoria Panóptica</span>
                  </div>
                </div>

                {/* Alerta de Erro */}
                {error && (
                  <div className="mb-4 p-3 bg-red-950/70 border border-red-500/50 rounded-xl text-xs text-red-200 flex items-start gap-2">
                    <IconAlert className="w-4 h-4 text-red-400 shrink-0 mt-0.5" />
                    <div className="font-semibold">{error}</div>
                  </div>
                )}

                {/* Formulário */}
                <form onSubmit={handleSubmit} className="space-y-4">
                  {/* Identificador */}
                  <div>
                    <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-300 mb-1.5">
                      Usuário ou E-mail do Docente / Diretor
                    </label>
                    <input
                      type="text"
                      required
                      value={identifier}
                      onChange={(e) => {
                        setIdentifier(e.target.value);
                        setError('');

                      placeholder="Ex: carlos, ana, mariana ou admin"
                      className="w-full text-sm font-medium rounded-xl border border-navy-700 px-4 py-3 bg-navy-900 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-white focus:border-white transition-all"

                        Selecione um perfil cadastrado para testar:
                      </span>
                      <div className="flex flex-wrap gap-1.5">
                        {users.map((u) => {
                          const isSelected = matched?.id === u.id;
                          return (
                            <button
                              key={u.id}
                              type="button"
                              onClick={() => handlePickUser(u)}

                        id="login-password-field"
                        type={showPassword ? 'text' : 'password'}

                        onChange={(e) => {

                        placeholder="Digite a senha cadastrada..."
                        className="w-full text-sm font-medium rounded-xl border border-navy-700 pl-4 pr-11 py-3 bg-navy-900 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-white focus:border-white transition-all font-mono"

                      <button

                        onClick={() => setShowPassword(!showPassword)}

                    <div className="mt-2 flex items-center justify-between text-xs bg-navy-900 border border-navy-750 px-3 py-2 rounded-xl text-slate-300">
                      <span className="flex items-center gap-1.5">
                        <span className="font-bold text-white">🔒 Senha padrão:</span>

      // ==========================================
      // PAINEL DO PROFESSOR (TEACHER DASHBOARD)
      // VOTAÇÃO SIGILOSA / VOTO CEGO - NÃO VÊ QUEM JÁ VOTOU OU O QUE MARCOU
      // 100% PERGUNTAS OBJETIVAS (SEM ESCREVER NADA)
      // ==========================================
      function TeacherDashboard({ currentUser, data, onSaveReport, onToggleStar }) {
        const [selectedClassId, setSelectedClassId] = useState(
          currentUser.assignedClassIds[0] || data.classes[0]?.id
        );
        const [answers, setAnswers] = useState({});
        const [savedMessage, setSavedMessage] = useState(null);

        const teacherClasses = data.classes.filter((c) => currentUser.assignedClassIds.includes(c.id));
        const selectedClass = data.classes.find((c) => c.id === selectedClassId) || teacherClasses[0];
        const classStudents = data.students.filter((st) => st.classId === selectedClass?.id);

        // Carrega o voto do PRÓPRIO professor para a turma selecionada
        useEffect(() => {
          if (!selectedClass) return;
          const myReport = data.reports.find(
            (r) => r.classId === selectedClass.id && r.teacherId === currentUser.id
          );
          setAnswers(myReport?.answers || {});
        }, [selectedClassId, data.reports, currentUser.id]);

        // Manipulação das opções objetivas por aluno
        const handleSelectOption = (studentId, questionKey, optionId) => {
          setAnswers((prev) => ({
            ...prev,
            [`st_${studentId}_${questionKey}`]: optionId,
          }));
        };

        // Preenchimento com padrão adequado em 1 clique (para acelerar 30 alunos em 5 segundos)
        const handleFillStandardAdequate = () => {
          const updated = { ...answers };
          classStudents.forEach((st) => {
            if (!updated[`st_${st.id}_rendimento`]) updated[`st_${st.id}_rendimento`] = 'adequado';
            if (!updated[`st_${st.id}_comportamento`]) updated[`st_${st.id}_comportamento`] = 'focado';
            if (!updated[`st_${st.id}_frequencia`]) updated[`st_${st.id}_frequencia`] = 'assiduo';
            if (!updated[`st_${st.id}_tarefas`]) updated[`st_${st.id}_tarefas`] = 'em_dia';
            if (!updated[`st_${st.id}_encaminhamento`]) updated[`st_${st.id}_encaminhamento`] = 'apoio';
          });
          setAnswers(updated);
          setSavedMessage('Padrão "Adequado" preenchido para todos os estudantes da turma! Agora ajuste apenas quem tem dificuldades ou destaque.');
          setTimeout(() => setSavedMessage(null), 4000);
        };

        const handleSave = () => {
          if (!selectedClass) return;
          const payload = {
            classId: selectedClass.id,
            className: selectedClass.name,
            teacherId: currentUser.id,
            teacherName: currentUser.name,
            subject: currentUser.subject || 'Componente Curricular',
            period: data.schoolConfig.period,
            date: new Date().toISOString().split('T')[0],
            status: 'submitted',
            answers,
          };
          onSaveReport(payload);
          setSavedMessage('Voto confidencial gravado com sucesso no sistema do conselho!');
          setTimeout(() => setSavedMessage(null), 4000);
        };

        // Cálculo de progresso do professor na turma
        const answeredStudentsCount = classStudents.filter((st) =>
          OBJECTIVE_QUESTIONS.every((q) => !!answers[`st_${st.id}_${q.key}`])
        ).length;
        const isComplete = classStudents.length > 0 && answeredStudentsCount === classStudents.length;

        // Voto já salvo no banco para este professor?
        const isAlreadySubmitted = data.reports.some(
          (r) => r.classId === selectedClass?.id && r.teacherId === currentUser.id && r.status === 'submitted'
        );

        return (
          <div className="space-y-6">
            {/* Aviso de Sigilo e Voto Cego */}
            <div className="bg-obsidian-950 border border-navy-750 rounded-2xl p-4 sm:p-5 shadow-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div className="flex items-start gap-3">
                <div className="w-10 h-10 rounded-xl bg-navy-850 border border-navy-700 text-white flex items-center justify-center shrink-0">
                  <IconLock className="w-5 h-5 text-white" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-black uppercase tracking-wider text-white">Votação Sigilosa / Voto Cego</span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-extrabold bg-blue-500/20 text-blue-200 border border-blue-500/30">
                      Docente Autônomo
                    </span>
                  </div>
                  <p className="text-xs text-slate-300 mt-0.5 leading-relaxed">
                    Suas marcações são estritamente confidenciais. Você <strong>não visualiza</strong> os votos de outros professores, e nenhum colega tem acesso às suas escolhas. A análise integrada é de exclusividade da Direção.
                  </p>
                </div>
              </div>

              {/* Status do Professor na Turma */}
              <div className="shrink-0 flex items-center gap-2">
                <div className={'px-3 py-1.5 rounded-xl border text-xs font-black flex items-center gap-2 ' +
                  (isAlreadySubmitted
                    ? 'bg-emerald-500/20 text-emerald-200 border-emerald-500/40'
                    : 'bg-amber-500/20 text-amber-200 border-amber-500/40')
                }>
                  <span className={'w-2 h-2 rounded-full ' + (isAlreadySubmitted ? 'bg-emerald-400' : 'bg-amber-400')} />
                  <span>{isAlreadySubmitted ? 'Sua Avaliação: Entregue Oficialmente' : 'Sua Avaliação: Pendente'}</span>
                </div>
              </div>
            </div>

            {/* Mensagem de Feedback */}
            {savedMessage && (
              <div className="p-4 bg-emerald-950/80 border border-emerald-500/50 rounded-2xl text-xs font-bold text-emerald-100 flex items-center justify-between shadow-lg">
                <div className="flex items-center gap-2">
                  <IconCheck className="w-4 h-4 text-emerald-400" />
                  <span>{savedMessage}</span>
                </div>
                <button
                  type="button"
                  onClick={() => setSavedMessage(null)}
                  className="text-emerald-400 hover:text-white text-xs underline cursor-pointer"
                >
                  Dispensar
                </button>
              </div>
            )}

            {/* Seletor de Turma do Professor */}
            <div className="bg-obsidian-950 border border-navy-750 rounded-2xl p-4 shadow-lg">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-navy-750">
                <div>
                  <h2 className="text-sm font-black text-white uppercase tracking-wider">
                    Suas Turmas Atribuídas ({currentUser.subject})
                  </h2>
                  <p className="text-xs text-slate-400">
                    Selecione a turma para responder as perguntas de cada aluno:
                  </p>
                </div>

                {/* Botões de Ação Rápida */}
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handleFillStandardAdequate}
                    className="px-3 py-2 bg-navy-850 hover:bg-navy-800 border border-navy-700 text-white rounded-xl text-xs font-extrabold flex items-center gap-1.5 cursor-pointer transition-all shadow-xs"
                    title="Preencher todos os estudantes da turma como 'Adequado' para você só ajustar as exceções"
                  >
                    <IconBolt className="w-3.5 h-3.5 text-amber-300" />

                  </button>

                  <button
                    type="button"
                    onClick={handleSave}
                    className="px-4 py-2 bg-white hover:bg-slate-200 text-navy-950 rounded-xl text-xs font-black flex items-center gap-1.5 cursor-pointer transition-all shadow-md"
                  >
                    <IconCheck className="w-3.5 h-3.5 text-navy-950" />
                    <span>Gravar Minha Avaliação</span>
                  </button>
                </div>
              </div>

              {/* Tabs de Turmas */}
              <div className="flex flex-wrap gap-2 mt-3">
                {teacherClasses.map((cls) => {
                  const isSelected = cls.id === selectedClass?.id;
                  const rep = data.reports.find((r) => r.classId === cls.id && r.teacherId === currentUser.id);
                  const isSubmitted = rep?.status === 'submitted';

                  return (
                    <button
                      key={cls.id}
                      type="button"
                      onClick={() => setSelectedClassId(cls.id)}
                      className={'px-4 py-2.5 rounded-xl text-xs font-black transition-all border flex items-center gap-2.5 cursor-pointer ' +
                        (isSelected
                          ? 'bg-white text-navy-950 border-white shadow-md'
                          : 'bg-navy-850 text-slate-300 border-navy-700 hover:bg-navy-800 hover:text-white')
                      }
                    >
                      <span>{cls.name}</span>
                      <span className={'px-1.5 py-0.5 rounded text-[10px] font-extrabold ' +
                        (isSelected
                          ? 'bg-navy-900 text-white'
                          : isSubmitted
                          ? 'bg-emerald-500/20 text-emerald-300'
                          : 'bg-amber-500/20 text-amber-300')
                      }>
                        {isSubmitted ? 'Gravado' : 'Pendente'}
                      </span>
                    </button>
                  );
                })}
              </div>

              {/* Indicador de progresso */}
              <div className="mt-4 pt-3 border-t border-navy-750 flex items-center justify-between text-xs text-slate-400">
                <span>
                  Progresso na turma <strong>{selectedClass?.name}</strong>: <strong className="text-white">{answeredStudentsCount} de {classStudents.length} alunos avaliados</strong>
                </span>
                <span className="font-mono text-white font-bold">
                  {classStudents.length > 0 ? Math.round((answeredStudentsCount / classStudents.length) * 100) : 0}%
                </span>
              </div>
            </div>

            {/* Listagem de Alunos com Perguntas 100% Objetivas */}
            <div className="space-y-4">
              {classStudents.map((student, idx) => {
                const isStar = student.isStar;

                return (
                  <div
                    key={student.id}
                    className="bg-obsidian-950 border border-navy-750 rounded-2xl p-4 sm:p-5 shadow-xl hover:border-navy-700 transition-all"
                  >
                    {/* Linha do Aluno */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-navy-750">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-lg bg-navy-850 border border-navy-700 flex items-center justify-center font-black text-xs text-white shrink-0">
                          {student.rollNumber || idx + 1}
                        </div>
                        <div>
                          <div className="flex items-center gap-2">
                            <h3 className="text-sm font-black text-white">{student.name}</h3>
                            {isStar && (
                              <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-black bg-amber-400/20 text-amber-200 border border-amber-400/40">
                                <IconStar className="w-3 h-3 text-amber-300" filled />
                                <span>Destaque Estrela</span>
                              </span>
                            )}
                          </div>
                          <div className="text-[11px] text-slate-400">
                            {selectedClass.name} · Chamada #{student.rollNumber}
                          </div>
                        </div>
                      </div>

                      {/* Botão de Estrela Rápido */}
                      <button
                        type="button"
                        onClick={() => onToggleStar(student.id)}
                        className={'px-3 py-1.5 rounded-xl border text-xs font-bold flex items-center gap-1.5 cursor-pointer transition-all ' +
                          (isStar
                            ? 'bg-amber-400/20 text-amber-200 border-amber-400/40'
                            : 'bg-navy-850 text-slate-300 border-navy-700 hover:text-white hover:bg-navy-800')
                        }
                      >
                        <IconStar className="w-3.5 h-3.5 text-amber-300" filled={isStar} />
                        <span>{isStar ? 'Aluno Destaque ⭐' : 'Indicar Destaque'}</span>
                      </button>
                    </div>

                    {/* Grade de Perguntas 100% Objetivas */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 mt-3.5">
                      {OBJECTIVE_QUESTIONS.map((question) => {
                        const currentVal = answers[`st_${student.id}_${question.key}`];

                        return (
                          <div key={question.key} className="bg-navy-900 border border-navy-750 rounded-xl p-3">
                            <span className="block text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">
                              {question.label}
                            </span>

                            <div className="grid grid-cols-2 gap-1.5">
                              {question.options.map((opt) => {
                                const isSelected = currentVal === opt.id;

                                return (
                                  <button
                                    key={opt.id}
                                    type="button"
                                    onClick={() => handleSelectOption(student.id, question.key, opt.id)}
                                    className={'px-2 py-2 rounded-lg text-xs font-extrabold transition-all border text-left flex items-center justify-between cursor-pointer ' +
                                      (isSelected
                                        ? 'bg-white text-navy-950 border-white shadow-sm ring-2 ring-white/50'
                                        : 'bg-navy-850 text-slate-300 border-navy-700 hover:bg-navy-800 hover:text-white')
                                    }
                                  >
                                    <span className="truncate">{opt.text}</span>
                                    {isSelected && <IconCheck className="w-3.5 h-3.5 text-navy-950 shrink-0 ml-1" />}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Botão Flutuante / Fim de Página para Gravar */}
            <div className="sticky bottom-4 z-20 flex justify-end">
              <button
                type="button"
                onClick={handleSave}
                className="px-6 py-3.5 bg-white hover:bg-slate-200 text-navy-950 font-black text-sm rounded-2xl shadow-2xl flex items-center gap-2 cursor-pointer transition-all border-2 border-white"
              >
                <IconCheck className="w-5 h-5 text-navy-950" />
                <span>Gravar Minhas Respostas da Turma {selectedClass?.name}</span>
              </button>
            </div>
          </div>
        );
      }

      // ==========================================
      // PAINEL DO DIRETOR / COORDENAÇÃO (ADMIN DASHBOARD)
      // AUDITORIA PANÓPTICA: QUEM JÁ VOTOU + O QUE CADA PROFESSOR MARCOU
      // ==========================================
      function AdminDashboard({ currentUser, data, onSendReminder, onToggleStar, onDownloadHtml }) {
        const [activeTab, setActiveTab] = useState('audit'); // 'audit' | 'matrix' | 'minutes'
        const [selectedClassId, setSelectedClassId] = useState(data.classes[0]?.id);
        const [expandedStudentId, setExpandedStudentId] = useState(null);

        const selectedClass = data.classes.find((c) => c.id === selectedClassId) || data.classes[0];
        const classStudents = data.students.filter((st) => st.classId === selectedClass?.id);

        // Professores atribuídos a esta turma
        const classTeachers = data.users.filter(
          (u) => u.role === 'teacher' && u.assignedClassIds.includes(selectedClass?.id)
        );

        // Relatórios entregues para esta turma
        const classReports = data.reports.filter((r) => r.classId === selectedClass?.id);

        // Quórum de votação na turma selecionada
        const votedTeacherIds = classReports.filter((r) => r.status === 'submitted').map((r) => r.teacherId);
        const quorumPercentage = classTeachers.length > 0
          ? Math.round((votedTeacherIds.length / classTeachers.length) * 100)
          : 0;

        // Análise consolidada por aluno (calcula alertas de risco com base nas respostas dos professores)
        const studentsAnalysis = useMemo(() => {
          return classStudents.map((st) => {
            const votes = [];
            classReports.forEach((rep) => {
              const rRendimento = rep.answers[`st_${st.id}_rendimento`];
              const rComportamento = rep.answers[`st_${st.id}_comportamento`];
              const rFrequencia = rep.answers[`st_${st.id}_frequencia`];
              const rTarefas = rep.answers[`st_${st.id}_tarefas`];
              const rEncaminhamento = rep.answers[`st_${st.id}_encaminhamento`];

              if (rRendimento || rComportamento || rFrequencia || rTarefas || rEncaminhamento) {
                votes.push({
                  teacherId: rep.teacherId,
                  teacherName: rep.teacherName,
                  subject: rep.subject,
                  rendimento: rRendimento,
                  comportamento: rComportamento,
                  frequencia: rFrequencia,
                  tarefas: rTarefas,
                  encaminhamento: rEncaminhamento,
                });
              }
            });

            // Contabilizar votos críticos
            const criticalCount = votes.filter(
              (v) =>
                v.rendimento === 'critico' ||
                v.comportamento === 'indisciplinado' ||
                v.frequencia === 'faltas_criticas' ||
                v.tarefas === 'nao_entrega' ||
                v.encaminhamento === 'recuperacao' ||
                v.encaminhamento === 'convocar_pais'
            ).length;

            const starVotesCount = votes.filter(
              (v) =>
                v.rendimento === 'excelente' ||
                v.comportamento === 'lider' ||
                v.encaminhamento === 'elogio'
            ).length;

            let riskLevel = 'adequado';
            if (criticalCount >= 2) riskLevel = 'critico'; // Alerta Vermelho
            else if (criticalCount === 1) riskLevel = 'atencao'; // Alerta Amarelo
            else if (starVotesCount >= 2 || st.isStar) riskLevel = 'destaque'; // Destaque

            return {
              student: st,
              votes,
              criticalCount,
              starVotesCount,
              riskLevel,
            };
          });
        }, [classStudents, classReports]);

        const criticalStudents = studentsAnalysis.filter((s) => s.riskLevel === 'critico');
        const attentionStudents = studentsAnalysis.filter((s) => s.riskLevel === 'atencao');
        const starStudents = studentsAnalysis.filter((s) => s.riskLevel === 'destaque' || s.student.isStar);

        const handlePrint = () => {
          window.print();
        };

        return (
          <div className="space-y-6">
            {/* Header da Diretoria / Seletor de Turma e Abas */}
            <div className="bg-obsidian-950 border border-navy-750 rounded-2xl p-5 shadow-xl">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-navy-750">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-black uppercase tracking-wider text-amber-300">
                      Painel Panóptico da Diretoria & Coordenação
                    </span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-black bg-white text-navy-950">
                      Acesso Total Irrestrito
                    </span>
                  </div>
                  <h2 className="text-base sm:text-lg font-black text-white mt-1">
                    Análise Coletiva e Auditoria de Votação do Conselho
                  </h2>
                </div>

                {/* Seletor de Turma */}
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-slate-400">Turma Analisada:</span>
                  <select
                    value={selectedClassId}
                    onChange={(e) => setSelectedClassId(e.target.value)}
                    className="bg-navy-900 border border-navy-750 text-white font-extrabold text-xs rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-white"
                  >
                    {data.classes.map((cls) => (
                      <option key={cls.id} value={cls.id}>
                        {cls.name} ({cls.shift})
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              {/* Barra de Abas do Diretor */}
              <div className="flex flex-wrap gap-2 mt-4">
                <button
                  type="button"
                  onClick={() => setActiveTab('audit')}
                  className={'px-4 py-2.5 rounded-xl text-xs font-black transition-all border flex items-center gap-2 cursor-pointer ' +
                    (activeTab === 'audit'
                      ? 'bg-white text-navy-950 border-white shadow-md'
                      : 'bg-navy-850 text-slate-300 border-navy-700 hover:bg-navy-800 hover:text-white')
                  }
                >
                  <IconUsers className="w-4 h-4" />
                  <span>1. Auditoria de Votação (Quem já votou)</span>
                  <span className="px-1.5 py-0.5 rounded text-[10px] bg-blue-500/20 text-blue-200">
                    {votedTeacherIds.length}/{classTeachers.length}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('matrix')}
                  className={'px-4 py-2.5 rounded-xl text-xs font-black transition-all border flex items-center gap-2 cursor-pointer ' +
                    (activeTab === 'matrix'
                      ? 'bg-white text-navy-950 border-white shadow-md'
                      : 'bg-navy-850 text-slate-300 border-navy-700 hover:bg-navy-800 hover:text-white')
                  }
                >
                  <IconEye className="w-4 h-4" />
                  <span>2. Matriz Analítica (O que cada professor marcou)</span>
                  {criticalStudents.length > 0 && (
                    <span className="px-1.5 py-0.5 rounded text-[10px] bg-red-500 text-white font-black">
                      {criticalStudents.length} Alertas
                    </span>
                  )}
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('minutes')}
                  className={'px-4 py-2.5 rounded-xl text-xs font-black transition-all border flex items-center gap-2 cursor-pointer ' +
                    (activeTab === 'minutes'
                      ? 'bg-white text-navy-950 border-white shadow-md'
                      : 'bg-navy-850 text-slate-300 border-navy-700 hover:bg-navy-800 hover:text-white')
                  }
                >
                  <IconPrinter className="w-4 h-4" />
                  <span>3. Ata Oficial Consolidada & Impressão</span>
                </button>
              </div>
            </div>

            {/* ABA 1: AUDITORIA DE PARTICIPAÇÃO (QUEM JÁ VOTOU E QUEM FALTA) */}
            {activeTab === 'audit' && (
              <div className="space-y-5">
                {/* Métricas de Quórum */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-obsidian-950 border border-navy-750 rounded-2xl p-4 shadow-lg">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">
                      Quórum de Votação
                    </span>
                    <div className="text-2xl font-black text-white mt-1">
                      {quorumPercentage}%
                    </div>
                    <div className="w-full bg-navy-900 h-2 rounded-full mt-2 overflow-hidden border border-navy-750">
                      <div
                        className="bg-white h-full transition-all duration-500"
                        style={{ width: `${quorumPercentage}%` }}
                      />
                    </div>
                  </div>

                  <div className="bg-obsidian-950 border border-navy-750 rounded-2xl p-4 shadow-lg">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">
                      Professores que Votaram
                    </span>
                    <div className="text-2xl font-black text-emerald-300 mt-1">
                      {votedTeacherIds.length} <span className="text-xs text-slate-400 font-normal">de {classTeachers.length}</span>
                    </div>
                    <span className="text-xs text-slate-400 mt-1 block">Avaliações gravadas no banco</span>
                  </div>

                  <div className="bg-obsidian-950 border border-navy-750 rounded-2xl p-4 shadow-lg">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">
                      Professores Pendentes
                    </span>
                    <div className="text-2xl font-black text-amber-300 mt-1">
                      {classTeachers.length - votedTeacherIds.length}
                    </div>
                    <span className="text-xs text-slate-400 mt-1 block">Aguardando preenchimento</span>
                  </div>
                </div>

                {/* Tabela de Auditoria dos Professores */}
                <div className="bg-obsidian-950 border border-navy-750 rounded-2xl p-5 shadow-xl">
                  <div className="flex items-center justify-between pb-3 mb-4 border-b border-navy-750">
                    <div>
                      <h3 className="text-sm font-black text-white uppercase tracking-wider">
                        Quadro de Professores da Turma: {selectedClass.name}
                      </h3>
                      <p className="text-xs text-slate-400">
                        Auditoria de quem já votou e data/hora de envio:
                      </p>
                    </div>

                    <button
                      type="button"
                      onClick={() => {
                        const pendings = classTeachers.filter((t) => !votedTeacherIds.includes(t.id));
                        pendings.forEach((t) => onSendReminder(t.name, selectedClass.name));
                      }}
                      className="px-3.5 py-1.5 rounded-xl bg-navy-850 hover:bg-navy-800 border border-navy-700 text-xs font-bold text-white transition-all cursor-pointer flex items-center gap-1.5"
                    >
                      <IconBell className="w-3.5 h-3.5 text-amber-300" />
                      <span>Cobrar Todos os Pendentes</span>
                    </button>
                  </div>

                  <div className="divide-y divide-navy-750">
                    {classTeachers.map((teacher) => {
                      const rep = classReports.find((r) => r.teacherId === teacher.id && r.status === 'submitted');
                      const hasVoted = !!rep;

                      return (
                        <div key={teacher.id} className="py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
                          <div className="flex items-center gap-3">
                            <div className={'w-9 h-9 rounded-xl flex items-center justify-center font-black text-xs shrink-0 ' +
                              (hasVoted ? 'bg-emerald-500/20 text-emerald-200 border border-emerald-500/40' : 'bg-navy-850 text-slate-300 border border-navy-700')
                            }>
                              {teacher.name.charAt(0)}
                            </div>
                            <div>
                              <div className="font-extrabold text-white text-sm flex items-center gap-2">
                                <span>{teacher.name}</span>
                                <span className="text-[11px] font-semibold text-slate-400">({teacher.subject})</span>
                              </div>
                              <div className="text-slate-400 text-xs mt-0.5">
                                E-mail institucional: {teacher.email}
                              </div>
                            </div>
                          </div>

                          <div className="flex items-center gap-3">
                            {hasVoted ? (
                              <div className="text-right">
                                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-emerald-500/20 text-emerald-200 border border-emerald-500/40 text-xs font-black">
                                  <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                                  <span>Votou com Sucesso</span>
                                </span>
                                <div className="text-[10px] text-slate-400 mt-1">
                                  Data do voto: {rep.submittedAt || rep.date}
                                </div>
                              </div>
                            ) : (
                              <div className="flex items-center gap-2">
                                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-amber-500/20 text-amber-200 border border-amber-500/40 text-xs font-black">
                                  <span>⏳ Pendente de Voto</span>
                                </span>
                                <button
                                  type="button"
                                  onClick={() => onSendReminder(teacher.name, selectedClass.name)}
                                  className="px-2.5 py-1 rounded-lg bg-navy-850 hover:bg-navy-800 border border-navy-700 text-xs font-bold text-white transition-colors cursor-pointer"
                                >
                                  Lembrar
                                </button>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ABA 2: MATRIZ ANALÍTICA DO CONSELHO (O QUE CADA PROFESSOR MARCOU) */}
            {activeTab === 'matrix' && (
              <div className="space-y-5">
                {/* Cards de Resumo de Risco */}
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                  <div className="bg-obsidian-950 border border-red-500/30 rounded-2xl p-4 shadow-lg">
                    <span className="text-[11px] font-bold text-red-300 uppercase tracking-wider block">
                      Risco Crítico (Alerta Vermelho)
                    </span>
                    <div className="text-2xl font-black text-red-400 mt-1">
                      {criticalStudents.length} Alunos
                    </div>
                    <span className="text-xs text-slate-400 mt-1 block">2+ votos de nota baixa ou infrequência</span>
                  </div>

                  <div className="bg-obsidian-950 border border-amber-500/30 rounded-2xl p-4 shadow-lg">
                    <span className="text-[11px] font-bold text-amber-300 uppercase tracking-wider block">
                      Atenção Pedagógica (Alerta Amarelo)
                    </span>
                    <div className="text-2xl font-black text-amber-300 mt-1">
                      {attentionStudents.length} Alunos
                    </div>
                    <span className="text-xs text-slate-400 mt-1 block">Dificuldades pontuais apontadas</span>
                  </div>

                  <div className="bg-obsidian-950 border border-emerald-500/30 rounded-2xl p-4 shadow-lg">
                    <span className="text-[11px] font-bold text-emerald-300 uppercase tracking-wider block">
                      Rendimento Adequado
                    </span>
                    <div className="text-2xl font-black text-emerald-300 mt-1">
                      {studentsAnalysis.filter((s) => s.riskLevel === 'adequado').length} Alunos
                    </div>
                    <span className="text-xs text-slate-400 mt-1 block">Dentro do esperado para o ciclo</span>
                  </div>

                  <div className="bg-obsidian-950 border border-blue-400/30 rounded-2xl p-4 shadow-lg">
                    <span className="text-[11px] font-bold text-blue-300 uppercase tracking-wider block">
                      Destaques do Conselho ⭐
                    </span>
                    <div className="text-2xl font-black text-amber-300 mt-1">
                      {starStudents.length} Alunos
                    </div>
                    <span className="text-xs text-slate-400 mt-1 block">Elogio em ata deliberado</span>
                  </div>
                </div>

                {/* Lista Detalhada de Alunos com Expansão de Respostas dos Professores */}
                <div className="bg-obsidian-950 border border-navy-750 rounded-2xl p-5 shadow-xl">
                  <div className="pb-3 mb-4 border-b border-navy-750">
                    <h3 className="text-sm font-black text-white uppercase tracking-wider">
                      Detalhamento por Aluno e Votação Individual de Cada Professor
                    </h3>
                    <p className="text-xs text-slate-400">
                      Clique no aluno para inspecionar exatamente o que cada docente marcou para cada critério objetivo:
                    </p>
                  </div>

                  <div className="space-y-3">
                    {studentsAnalysis.map(({ student, votes, riskLevel }) => {
                      const isExpanded = expandedStudentId === student.id;

                      let badgeClass = 'bg-emerald-500/20 text-emerald-200 border-emerald-500/40';
                      let badgeText = 'Adequado';
                      if (riskLevel === 'critico') {
                        badgeClass = 'bg-red-500/20 text-red-200 border-red-500/40';
                        badgeText = '🔴 Risco Crítico';
                      } else if (riskLevel === 'atencao') {
                        badgeClass = 'bg-amber-500/20 text-amber-200 border-amber-500/40';
                        badgeText = '🟡 Atenção';
                      } else if (riskLevel === 'destaque') {
                        badgeClass = 'bg-amber-400/20 text-amber-200 border-amber-400/40';
                        badgeText = '⭐ Destaque do Conselho';
                      }

                      return (
                        <div
                          key={student.id}
                          className="bg-navy-900 border border-navy-750 rounded-xl overflow-hidden transition-all"
                        >
                          {/* Barra do Aluno */}
                          <div
                            onClick={() => setExpandedStudentId(isExpanded ? null : student.id)}
                            className="p-4 flex items-center justify-between gap-3 cursor-pointer hover:bg-navy-850 transition-colors"
                          >
                            <div className="flex items-center gap-3">
                              <div className="w-8 h-8 rounded-lg bg-navy-800 border border-navy-700 flex items-center justify-center font-black text-xs text-white">
                                {student.rollNumber}
                              </div>
                              <div>
                                <div className="font-black text-white text-sm flex items-center gap-2">
                                  <span>{student.name}</span>
                                  <span className={'px-2 py-0.5 rounded text-[10px] font-black border ' + badgeClass}>
                                    {badgeText}
                                  </span>
                                </div>
                                <div className="text-xs text-slate-400">
                                  {votes.length} de {classTeachers.length} professores já avaliaram este aluno
                                </div>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <span className="text-xs font-bold text-slate-300 hidden sm:inline">
                                {isExpanded ? 'Ocultar Detalhes' : 'Ver Votos dos Professores'}
                              </span>
                              {isExpanded ? (
                                <IconChevronUp className="w-5 h-5 text-white" />
                              ) : (
                                <IconChevronDown className="w-5 h-5 text-slate-400" />
                              )}
                            </div>
                          </div>

                          {/* Área Expandida com a Comparação Entre Professores */}
                          {isExpanded && (
                            <div className="p-4 bg-obsidian-950 border-t border-navy-750">
                              {votes.length === 0 ? (
                                <p className="text-xs text-slate-400 italic">
                                  Nenhum professor gravou avaliação para este estudante ainda.
                                </p>
                              ) : (
                                <div className="overflow-x-auto">
                                  <table className="w-full text-left text-xs">
                                    <thead>
                                      <tr className="border-b border-navy-750 text-slate-400 uppercase tracking-wider text-[10px]">
                                        <th className="py-2 pr-3">Professor / Disciplina</th>
                                        <th className="py-2 px-3">Rendimento</th>
                                        <th className="py-2 px-3">Comportamento</th>
                                        <th className="py-2 px-3">Assiduidade</th>
                                        <th className="py-2 px-3">Tarefas</th>
                                        <th className="py-2 pl-3">Encaminhamento</th>
                                      </tr>
                                    </thead>
                                    <tbody className="divide-y divide-navy-800">
                                      {votes.map((v, vIdx) => {
                                        return (
                                          <tr key={vIdx} className="hover:bg-navy-900/50">
                                            <td className="py-2.5 pr-3 font-extrabold text-white">
                                              <div>{v.teacherName}</div>
                                              <div className="text-[10px] text-slate-400">{v.subject}</div>
                                            </td>
                                            <td className="py-2.5 px-3">
                                              <span className="font-semibold text-slate-200">
                                                {formatOptionText('rendimento', v.rendimento)}
                                              </span>
                                            </td>
                                            <td className="py-2.5 px-3">
                                              <span className="font-semibold text-slate-200">
                                                {formatOptionText('comportamento', v.comportamento)}
                                              </span>
                                            </td>
                                            <td className="py-2.5 px-3">
                                              <span className="font-semibold text-slate-200">
                                                {formatOptionText('frequencia', v.frequencia)}
                                              </span>
                                            </td>
                                            <td className="py-2.5 px-3">
                                              <span className="font-semibold text-slate-200">
                                                {formatOptionText('tarefas', v.tarefas)}
                                              </span>
                                            </td>
                                            <td className="py-2.5 pl-3">
                                              <span className={'px-2 py-1 rounded text-[11px] font-bold border ' +
                                                (v.encaminhamento === 'recuperacao'
                                                  ? 'bg-red-500/20 text-red-200 border-red-500/40'
                                                  : v.encaminhamento === 'convocar_pais'
                                                  ? 'bg-amber-500/20 text-amber-200 border-amber-500/40'
                                                  : v.encaminhamento === 'elogio'
                                                  ? 'bg-amber-400/20 text-amber-200 border-amber-400/40'
                                                  : 'bg-blue-500/20 text-blue-200 border-blue-500/40')
                                              }>
                                                {formatOptionText('encaminhamento', v.encaminhamento)}
                                              </span>
                                            </td>
                                          </tr>
                                        );
                                      })}
                                    </tbody>
                                  </table>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ABA 3: ATA OFICIAL CONSOLIDADA & IMPRESSÃO */}
            {activeTab === 'minutes' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between bg-obsidian-950 border border-navy-750 p-4 rounded-2xl shadow-lg">
                  <div>
                    <h3 className="text-sm font-black text-white uppercase tracking-wider">
                      Ata Oficial do Conselho de Classe — Turma: {selectedClass.name}
                    </h3>
                    <p className="text-xs text-slate-400">
                      Documento institucional formal para arquivamento e deliberação coletiva.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={handlePrint}
                    className="px-4 py-2.5 bg-white hover:bg-slate-200 text-navy-950 font-black text-xs rounded-xl shadow-md flex items-center gap-2 cursor-pointer transition-all"
                  >
                    <IconPrinter className="w-4 h-4 text-navy-950" />
                    <span>Imprimir Ata Oficial / Salvar PDF</span>
                  </button>
                </div>

                {/* Folha Oficial da Ata (Renderiza bem na tela e perfeito no print) */}
                <div className="bg-white text-slate-950 p-8 sm:p-12 rounded-2xl shadow-2xl border border-slate-300 print:border-none print:shadow-none print:p-0">
                  {/* Cabeçalho da Escola */}
                  <div className="text-center pb-6 border-b-2 border-slate-900">
                    <h1 className="text-base sm:text-lg font-black tracking-tight text-slate-900 uppercase">
                      {data.schoolConfig.name}
                    </h1>
                    <p className="text-xs font-bold text-slate-700 uppercase mt-0.5">
                      {data.schoolConfig.subtitle}
                    </p>
                    <div className="mt-2 inline-block px-4 py-1 bg-slate-900 text-white text-xs font-black uppercase tracking-wider rounded">
                      ATA OFICIAL DE DELIBERAÇÃO DO CONSELHO DE CLASSE — {data.schoolConfig.period}
                    </div>
                  </div>

                  {/* Metadados da Reunião */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 py-4 text-xs border-b border-slate-300">
                    <div>
                      <span className="font-bold text-slate-500 block">Turma:</span>
                      <strong className="text-slate-900 text-sm">{selectedClass.name}</strong>
                    </div>
                    <div>
                      <span className="font-bold text-slate-500 block">Turno:</span>
                      <strong className="text-slate-900">{selectedClass.shift}</strong>
                    </div>
                    <div>
                      <span className="font-bold text-slate-500 block">Quórum Docente:</span>
                      <strong className="text-slate-900">{votedTeacherIds.length} de {classTeachers.length} professores</strong>
                    </div>
                    <div>
                      <span className="font-bold text-slate-500 block">Data de Emissão:</span>
                      <strong className="text-slate-900">{new Date().toLocaleDateString('pt-BR')}</strong>
                    </div>
                  </div>

                  {/* Resumo Deliberativo */}
                  <div className="my-6">
                    <h2 className="text-xs font-black uppercase tracking-wider text-slate-900 mb-2">
                      1. Quadro Consolidado de Encaminhamentos por Aluno
                    </h2>
                    <table className="print-table w-full text-left text-xs border border-slate-300">
                      <thead className="bg-slate-100 border-b border-slate-300 font-black text-slate-900">
                        <tr>
                          <th className="p-2 border-r border-slate-300 w-12 text-center">Nº</th>
                          <th className="p-2 border-r border-slate-300">Nome do Estudante</th>
                          <th className="p-2 border-r border-slate-300">Classificação</th>
                          <th className="p-2 border-r border-slate-300">Votos Docentes</th>
                          <th className="p-2">Deliberação Coletiva do Conselho</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {studentsAnalysis.map(({ student, votes, riskLevel }) => (
                          <tr key={student.id}>
                            <td className="p-2 border-r border-slate-300 text-center font-bold">
                              {student.rollNumber}
                            </td>
                            <td className="p-2 border-r border-slate-300 font-extrabold text-slate-900">
                              {student.name}
                            </td>
                            <td className="p-2 border-r border-slate-300 font-bold">
                              {riskLevel === 'critico' && <span className="text-red-700">🔴 Risco Crítico</span>}
                              {riskLevel === 'atencao' && <span className="text-amber-700">🟡 Atenção</span>}
                              {riskLevel === 'adequado' && <span className="text-emerald-700">🟢 Adequado</span>}
                              {riskLevel === 'destaque' && <span className="text-blue-800">⭐ Destaque</span>}
                            </td>
                            <td className="p-2 border-r border-slate-300 text-[11px] text-slate-600">
                              {votes.length} pareceres gravados
                            </td>
                            <td className="p-2 font-bold text-slate-800 text-xs">
                              {riskLevel === 'critico' && 'Convocação urgente de responsáveis e plano de recuperação.'}
                              {riskLevel === 'atencao' && 'Encaminhamento para apoio pedagógico e monitoria.'}
                              {riskLevel === 'adequado' && 'Manutenção das rotinas regulares de aprendizagem.'}
                              {riskLevel === 'destaque' && 'Registro formal de elogio em ata e menção honrosa.'}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Assinaturas da Direção */}
                  <div className="mt-12 pt-8 border-t-2 border-slate-900 grid grid-cols-2 gap-8 text-center text-xs">
                    <div>
                      <div className="border-b border-slate-400 mb-2 w-3/4 mx-auto pb-6" />
                      <div className="font-extrabold text-slate-900">{data.schoolConfig.pedagogueName}</div>
                      <div className="text-slate-500">Coordenação Pedagógica</div>
                    </div>
                    <div>
                      <div className="border-b border-slate-400 mb-2 w-3/4 mx-auto pb-6" />
                      <div className="font-extrabold text-slate-900">{data.schoolConfig.principalName}</div>
                      <div className="text-slate-500">Direção Geral</div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Helper para exibição amigável de opções objetivas
      function formatOptionText(questionKey, optionId) {
        if (!optionId) return '—';
        const q = OBJECTIVE_QUESTIONS.find((item) => item.key === questionKey);
        const opt = q?.options.find((o) => o.id === optionId);
        return opt ? opt.text : optionId;
      }

      // Renderiza a aplicação no root
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
