      function getSavedData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {
          console.error('Erro ao ler localStorage', e);
        }
        return {
          users: INITIAL_USERS,

          ],
        };
      }

      function saveData(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error('Erro ao salvar localStorage', e);
        }
      }

        const handleToggleStar = (studentId, details) => {
          setAppData((prev) => {
            const nextStudents = prev.students.map((st) => {
              if (st.id === studentId) {
                const nextIsStar = details?.isStar !== undefined ? details.isStar : !st.isStar;
                return {
                  ...st,
                  isStar: nextIsStar,
                  starCategory: nextIsStar ? (details?.starCategory || st.starCategory || 'academic') : undefined,
                  starReason: nextIsStar ? (details?.starReason || st.starReason || 'Destaque acadêmico e participativo reconhecido no conselho.') : undefined,
                  starAddedBy: nextIsStar ? (details?.starAddedBy || currentUser?.name || 'Conselho Docente') : undefined,
                };
              }
              return st;
            });
            return { ...prev, students: nextStudents };
          });
        };

        const handleSaveReport = (reportData) => {
          setAppData((prev) => {
            const existingIndex = prev.reports.findIndex((r) => r.classId === reportData.classId && r.teacherId === reportData.teacherId);
            let nextReports;
            if (existingIndex >= 0) {
              nextReports = [...prev.reports];
              nextReports[existingIndex] = { ...nextReports[existingIndex], ...reportData, updatedAt: new Date().toISOString() };
            } else {
              const newReport = {
                ...reportData,
                id: 'rep-' + Date.now(),
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
              };
              nextReports = [newReport, ...prev.reports];
            }
            return { ...prev, reports: nextReports };
          });
        };

            return { ...prev, students: [...prev.students, newStudent] };
          });

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'pre_conselho_escolar_autonomo.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

                            }`}>
                              <span>Entrar</span>
                              <IconArrowRight className="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform" />
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Aba 2: Digitar Credenciais */}
                {activeTab === 'credentials' && (
                  <div className="p-6 sm:p-8 max-w-lg mx-auto">
                    <div className="text-center mb-6">
                      <h2 className="text-lg font-bold text-slate-900">Acesso por Usuário ou E-mail</h2>
                      <p className="text-xs text-slate-500 mt-1">Digite seu nome, usuário escolar ou e-mail cadastrado:</p>
                    </div>

                    {error && (
                      <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs font-semibold rounded-xl">
                        {error}
                      </div>
                    )}

                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                          Usuário, Nome ou E-mail
                        </label>
                        <input
                          type="text"
                          required
                          value={identifier}
                          onChange={(e) => { setIdentifier(e.target.value); setError(''); }}
                          placeholder="Ex: Carlos, Ana, Roberto, admin..."
                          className="w-full text-sm rounded-xl border border-slate-300 px-4 py-3 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600"
                        />
                        {matched && (
                          <div className="mt-2 p-2 bg-emerald-50 border border-emerald-200 rounded-lg text-xs text-emerald-800 flex items-center justify-between">
                            <span>✓ Perfil identificado: <strong>{matched.name}</strong> ({matched.role === 'admin' ? 'Coordenação' : matched.subject})</span>
                            <button
                              type="button"
                              onClick={() => onLogin(matched)}
                              className="font-bold underline cursor-pointer ml-2"
                            >
                              Entrar agora →
                            </button>
                          </div>
                        )}
                      </div>

                      <div>
                        <div className="flex items-center justify-between mb-1.5">
                          <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                            Senha
                          </label>
                          <span className="text-[11px] text-blue-600">Ambiente de demonstração (qualquer senha é aceita)</span>
                        </div>
                        <div className="relative">
                          <input
                            type={showPassword ? 'text' : 'password'}
                            value={password}
                            onChange={(e) => setPassword(e.target.value)}
                            placeholder="••••••••"
                            className="w-full text-sm rounded-xl border border-slate-300 pl-4 pr-10 py-3 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600"
                          />
                          <button
                            type="button"
                            onClick={() => setShowPassword(!showPassword)}
                            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 cursor-pointer"
                          >
                            {showPassword ? <IconEyeOff className="w-4 h-4" /> : <IconEye className="w-4 h-4" />}
                          </button>
                        </div>
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3.5 px-4 bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm rounded-xl shadow-md transition-all cursor-pointer"
                      >
                        Entrar no Pré-Conselho
                      </button>
                    </form>

                    <div className="mt-6 pt-5 border-t border-slate-100 flex flex-wrap justify-center gap-1.5">
                      {users.slice(0, 5).map((u) => (
                        <button
                          key={u.id}
                          type="button"
                          onClick={() => { setIdentifier(u.username); onLogin(u); }}
                          className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-blue-100 text-slate-700 transition-colors cursor-pointer"
                        >
                          {u.name.split(' ')[0]} ({u.role === 'admin' ? 'Coord.' : u.subject.split(' ')[0]})
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // PAINEL DO PROFESSOR (TEACHER DASHBOARD)
      // ==========================================
      function TeacherDashboard({ currentUser, data, onSaveReport, onToggleStar, onViewReport, onOpenStarModal }) {
        const [currentStep, setCurrentStep] = useState('select_class'); // 'select_class' | 'fill_form'
        const [selectedClassId, setSelectedClassId] = useState(null);
        const [answers, setAnswers] = useState({});
        const [showRosterInForm, setShowRosterInForm] = useState(true);
        const [lastActiveQId, setLastActiveQId] = useState(null);
        const [savedMessage, setSavedMessage] = useState(null);
        const [isListening, setIsListening] = useState(false);
        const [activeListeningQId, setActiveListeningQId] = useState(null);
        const [phraseModalQ, setPhraseModalQ] = useState(null);

        // Turmas atribuídas ao professor
        const teacherClasses = data.classes.filter((c) => currentUser.assignedClassIds.includes(c.id));
        const selectedClass = data.classes.find((c) => c.id === selectedClassId);

        // Carregar relatório existente quando seleciona turma
        const handleSelectClass = (classId) => {
          setSelectedClassId(classId);
          const rep = data.reports.find((r) => r.classId === classId && r.teacherId === currentUser.id);
          setAnswers(rep?.answers || {});
          setCurrentStep('fill_form');
        };

        const handleSave = (status = 'draft') => {
          if (!selectedClass) return;
          const reportPayload = {
            classId: selectedClass.id,
            className: selectedClass.name,
            teacherId: currentUser.id,
            teacherName: currentUser.name,
            subject: currentUser.subject || 'Geral',
            period: data.schoolConfig.period,
            date: new Date().toISOString().split('T')[0],
            status,
            answers,
          };
          onSaveReport(reportPayload);
          setSavedMessage(status === 'submitted' ? 'Ficha entregue oficialmente com sucesso!' : 'Rascunho salvo!');
          setTimeout(() => setSavedMessage(null), 3000);
          if (status === 'submitted') {
            setCurrentStep('select_class');
          }
        };

        const handleInsertStudent = (studentName, qId) => {
          const target = qId || lastActiveQId || 'q-5';
          setAnswers((prev) => {
            const current = prev[target] || '';
            const addition = current.trim() ? `, ${studentName}` : studentName;
            return { ...prev, [target]: current + addition };
          });
        };

        // Reconhecimento de Voz (Web Speech API)
        const handleToggleVoice = (qId) => {
          if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('Reconhecimento de voz não é suportado pelo seu navegador atual.');
            return;
          }
          if (isListening) {
            setIsListening(false);
            setActiveListeningQId(null);
            return;
          }
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          const recognition = new SpeechRecognition();
          recognition.lang = 'pt-BR';
          recognition.continuous = false;
          recognition.interimResults = false;

          recognition.onstart = () => {
            setIsListening(true);
            setActiveListeningQId(qId);
          };
          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setAnswers((prev) => {
              const cur = prev[qId] || '';
              return { ...prev, [qId]: cur ? `${cur} ${transcript}` : transcript };
            });
            setIsListening(false);
            setActiveListeningQId(null);
          };
          recognition.onerror = () => {
            setIsListening(false);
            setActiveListeningQId(null);
          };
          recognition.onend = () => {
            setIsListening(false);
            setActiveListeningQId(null);
          };
          recognition.start();
        };

        return (
          <div className="space-y-6">
            {/* ETAPA 1: SELECIONAR TURMA */}
            {currentStep === 'select_class' && (
              <div className="space-y-5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <h2 className="text-xl font-black text-slate-900">Suas Turmas Atribuídas</h2>
                    <p className="text-xs sm:text-sm text-slate-500">
                      Escolha a turma para preencher ou revisar a ficha de pré-conselho:
                    </p>
                  </div>
                  <span className="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-xl self-start">
                    {teacherClasses.length} turmas atribuídas
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {teacherClasses.map((cls) => {
                    const classReport = data.reports.find((r) => r.classId === cls.id && r.teacherId === currentUser.id);
                    const isSubmitted = classReport?.status === 'submitted';
                    const isDraft = classReport?.status === 'draft';
                    const clsStudents = data.students.filter((s) => s.classId === cls.id);
                    const starCount = clsStudents.filter((s) => s.isStar).length;

                    return (
                      <div
                        key={cls.id}
                        className={`bg-white rounded-3xl border p-5 sm:p-6 shadow-xs flex flex-col justify-between transition-all ${
                          isSubmitted ? 'border-emerald-200' : isDraft ? 'border-amber-200' : 'border-slate-200'
                        }`}
                      >
                        <div>
                          <div className="flex items-start justify-between mb-3">
                            <div>
                              <div className="text-xs text-slate-500 font-medium">Turno {cls.shift} · {cls.grade}</div>
                              <h3 className="text-xl font-bold text-slate-900 mt-0.5">{cls.name}</h3>
                              <div className="flex items-center gap-2 mt-1">
                                <span className="text-xs text-slate-500">{clsStudents.length} estudantes matriculados</span>
                                {starCount > 0 && (
                                  <span className="inline-flex items-center gap-1 text-[11px] font-bold text-amber-800 bg-amber-100/80 px-2 py-0.5 rounded-md border border-amber-300">
                                    <IconStar className="w-3 h-3 fill-amber-500 text-amber-600" filled />
                                    <span>{starCount} Alunos Estrela ⭐</span>
                                  </span>
                                )}
                              </div>
                            </div>

                            {/* Status */}
                            {isSubmitted ? (
                              <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">Entregue</span>
                            ) : isDraft ? (
                              <span className="text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200">Rascunho</span>
                            ) : (
                              <span className="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">Pendente</span>
                            )}
                          </div>

                          {/* RELAÇÃO NOMINAL DOS ALUNOS VISÍVEL DIRETO NO CARD */}
                          <div className="mb-4 p-3 bg-slate-50/90 rounded-2xl border border-slate-100 space-y-1.5">
                            <div className="flex items-center justify-between text-[11px] font-bold text-slate-700">
                              <span className="flex items-center gap-1.5">
                                <IconUsers className="w-3.5 h-3.5 text-slate-500" />
                                <span>Alunos da Turma ({clsStudents.length}):</span>
                              </span>
                              {starCount > 0 && (
                                <span className="text-amber-900 font-bold flex items-center gap-1">
                                  <IconStar className="w-3 h-3 fill-amber-400 text-amber-500" filled />
                                  <span>{starCount} Destaques ⭐</span>
                                </span>
                              )}
                            </div>
                            <div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto pt-1">
                              {clsStudents.map((st) => (
                                <span
                                  key={st.id}
                                  className={`inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-md border ${
                                    st.isStar ? 'bg-amber-100 text-amber-900 border-amber-300 font-bold' : 'bg-white text-slate-700 border-slate-200'
                                  }`}
                                >
                                  {st.isStar && <IconStar className="w-2.5 h-2.5 fill-amber-500 text-amber-600" filled />}
                                  <span>#{st.rollNumber} {st.name.split(' ')[0]} {st.name.split(' ')[1] || ''}</span>
                                </span>
                              ))}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-2 pt-2">
                          {isSubmitted && classReport && (
                            <button
                              type="button"
                              onClick={() => onViewReport(classReport)}
                              className="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-colors cursor-pointer text-xs font-bold"
                              title="Ver ficha oficial enviada"
                            >
                              Ver Ficha
                            </button>
                          )}
                          <button
                            type="button"
                            onClick={() => handleSelectClass(cls.id)}
                            className="flex-1 py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-xs flex items-center justify-center gap-1.5 transition-all cursor-pointer"
                          >
                            <span>{isSubmitted ? 'Revisar Parecer da Turma' : isDraft ? 'Continuar Preenchimento' : 'Preencher Parecer da Turma'}</span>
                            <IconArrowRight className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ETAPA 2: PREENCHIMENTO DA FICHA */}
            {currentStep === 'fill_form' && selectedClass && (
              <div className="space-y-6">
                {/* Barra de navegação e salvar */}
                <div className="bg-white rounded-3xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setCurrentStep('select_class')}
                      className="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-colors cursor-pointer"
                      title="Voltar às turmas"
                    >
                      <IconArrowLeft className="w-5 h-5" />
                    </button>
                    <div>
                      <div className="text-xs font-semibold text-blue-700">Ficha do Pré-Conselho de Classe</div>
                      <h2 className="text-lg sm:text-xl font-black text-slate-900">{selectedClass.name}</h2>
                      <p className="text-xs text-slate-500">Componente: <strong>{currentUser.subject}</strong> · Turno {selectedClass.shift}</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    {savedMessage && (
                      <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 animate-in fade-in">
                        {savedMessage}
                      </span>
                    )}
                    <button
                      type="button"
                      onClick={() => handleSave('draft')}
                      className="py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-colors cursor-pointer"
                    >
                      Salvar Rascunho
                    </button>
                    <button
                      type="button"
                      onClick={() => handleSave('submitted')}
                      className="py-2.5 px-5 bg-blue-700 hover:bg-blue-800 text-white font-bold text-xs sm:text-sm rounded-xl shadow-xs transition-colors cursor-pointer"
                    >
                      Entregar Ficha Oficial
                    </button>
                  </div>
                </div>

                {/* RELAÇÃO NOMINAL DA TURMA COM ALUNOS ESTRELA ⭐ */}
                {(() => {
                  const classStudents = data.students.filter((s) => s.classId === selectedClass.id).sort((a,b) => a.rollNumber - b.rollNumber);
                  const stars = classStudents.filter((s) => s.isStar);
                  return (
                    <div className="bg-white rounded-3xl border border-blue-200/90 shadow-xs p-5 sm:p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center font-bold shadow-xs">
                            <IconUsers className="w-5 h-5 text-blue-300" />
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="text-base font-bold text-slate-900">
                                Relação Nominal de Alunos: {selectedClass.name}
                              </h3>
                              <span className="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-0.5 rounded-full">
                                {classStudents.length} matriculados
                              </span>
                            </div>
                            <p className="text-xs text-slate-500 mt-0.5">
                              Clique na estrela ⭐ para indicar os melhores alunos ou clique no nome para inseri-lo no parecer.
                            </p>
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 font-bold text-xs shadow-2xs">
                            <IconStar className="w-4 h-4 fill-amber-400 text-amber-500" filled />
                            <span>{stars.length} Alunos Estrela ⭐</span>
                          </span>
                          <button
                            type="button"
                            onClick={() => setShowRosterInForm(!showRosterInForm)}
                            className="text-xs font-bold text-blue-700 hover:text-blue-900 cursor-pointer ml-2"
                          >
                            {showRosterInForm ? 'Ocultar Lista' : 'Exibir Lista'}
                          </button>
                        </div>
                      </div>

                      {showRosterInForm && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 pt-1">
                          {classStudents.map((st) => (
                            <div
                              key={st.id}
                              className={`p-2.5 rounded-xl border flex items-center justify-between gap-2 transition-colors ${
                                st.isStar ? 'bg-amber-50/70 border-amber-300 shadow-2xs' : 'bg-slate-50 border-slate-200 hover:bg-slate-100/70'
                              }`}
                            >
                              <div
                                onClick={() => handleInsertStudent(st.name)}
                                className="flex items-center gap-2 min-w-0 flex-1 cursor-pointer"
                                title="Clique para inserir o nome deste estudante na resposta atual"
                              >
                                <span className="w-6 h-6 rounded-md bg-white border border-slate-200 text-slate-700 font-mono text-[11px] font-bold flex items-center justify-center shrink-0">
                                  {String(st.rollNumber).padStart(2, '0')}
                                </span>
                                <span className="text-xs font-bold text-slate-900 truncate">{st.name}</span>
                              </div>

                              <button
                                type="button"
                                onClick={() => onOpenStarModal(st)}
                                className={`p-1.5 rounded-lg transition-colors cursor-pointer shrink-0 ${
                                  st.isStar ? 'text-amber-500 hover:bg-amber-100' : 'text-slate-300 hover:text-amber-400 hover:bg-slate-200/60'
                                }`}
                                title={st.isStar ? `Aluno Estrela ⭐: ${st.starReason || 'Destaque'}` : 'Conceder Estrela ao Aluno'}
                              >
                                <IconStar className="w-4 h-4" filled={st.isStar} />
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })()}

                {/* FORMULÁRIO DE SEÇÕES E PERGUNTAS */}
                <div className="space-y-6">
                  {data.sections.sort((a,b) => a.order - b.order).map((sec) => {
                    const secQuestions = data.questions.filter((q) => q.sectionId === sec.id).sort((a,b) => a.order - b.order);
                    if (secQuestions.length === 0) return null;

                    const classStudents = data.students.filter((s) => s.classId === selectedClass.id).sort((a,b) => a.rollNumber - b.rollNumber);

                    return (
                      <div key={sec.id} className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-xs space-y-6">
                        <div className="border-b border-slate-200 pb-3">
                          <h3 className="text-sm sm:text-base font-black text-slate-900 uppercase tracking-wide">
                            {sec.title}
                          </h3>
                        </div>

                        <div className="space-y-6">
                          {secQuestions.map((q) => {
                            const val = answers[q.id] || '';
                            const isStarQuestion = q.id === 'q-5' || q.prompt.toLowerCase().includes('destac');
                            const isListeningThis = isListening && activeListeningQId === q.id;

                            return (
                              <div key={q.id} className="space-y-2">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                  <label className="text-xs sm:text-sm font-bold text-slate-800 leading-snug">
                                    {q.prompt} {q.required && <span className="text-red-500">*</span>}
                                  </label>

                                  <div className="flex items-center gap-2 shrink-0">
                                    {/* Falar por voz */}
                                    <button
                                      type="button"
                                      onClick={() => handleToggleVoice(q.id)}
                                      className={`py-1 px-2.5 rounded-lg text-xs font-semibold flex items-center gap-1 cursor-pointer transition-colors ${
                                        isListeningThis ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                                      }`}
                                      title="Ditar parecer por voz (microfone)"
                                    >
                                      <IconMic className="w-3.5 h-3.5" />
                                      <span>{isListeningThis ? 'Gravando...' : 'Falar'}</span>
                                    </button>

                                    {/* Banco de Frases */}
                                    <button
                                      type="button"
                                      onClick={() => setPhraseModalQ(q)}
                                      className="py-1 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1 cursor-pointer"
                                      title="Inserir sugestão pedagógica pronta"
                                    >
                                      <IconLightbulb className="w-3.5 h-3.5 text-amber-500" />
                                      <span>Sugestões</span>
                                    </button>
                                  </div>
                                </div>

                                {/* Chips de Alunos da Turma para inserir na resposta */}
                                <div className="p-2.5 bg-slate-50 border border-slate-200/80 rounded-xl space-y-1.5">
                                  <div className="flex items-center justify-between text-[11px] font-semibold text-slate-600">
                                    <span className="flex items-center gap-1">
                                      {isStarQuestion ? <IconStar className="w-3.5 h-3.5 fill-amber-400 text-amber-500" filled /> : <IconUsers className="w-3.5 h-3.5 text-slate-500" />}
                                      <span>{isStarQuestion ? 'Estudantes da Turma (clique para inserir e conceder estrela ⭐):' : 'Inserir estudante na resposta:'}</span>
                                    </span>
                                  </div>
                                  <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
                                    {classStudents.map((st) => (
                                      <button
                                        key={st.id}
                                        type="button"
                                        onClick={() => {
                                          handleInsertStudent(st.name, q.id);
                                          if (isStarQuestion && !st.isStar) {
                                            onToggleStar(st.id, { isStar: true });
                                          }
                                        }}
                                        className={`py-1 px-2.5 rounded-lg text-xs font-medium flex items-center gap-1 cursor-pointer transition-colors ${
                                          st.isStar ? 'bg-amber-100 text-amber-950 border border-amber-300 font-bold' : 'bg-white text-slate-700 border border-slate-200 hover:bg-blue-50'
                                        }`}
                                      >
                                        {st.isStar && <IconStar className="w-3 h-3 fill-amber-500 text-amber-600" filled />}
                                        <span>#{st.rollNumber} {st.name}</span>
                                      </button>
                                    ))}
                                  </div>
                                </div>

                                <textarea
                                  rows="3"
                                  value={val}
                                  onFocus={() => setLastActiveQId(q.id)}
                                  onChange={(e) => setAnswers({ ...answers, [q.id]: e.target.value })}
                                  placeholder="Digite seu parecer pedagógico para este quesito..."

          a.href = url;

                  <h3 className="text-base font-bold text-slate-900">Gerenciamento de Dados</h3>
                  <p className="text-xs text-slate-500">
                    Se desejar restaurar todos os dados iniciais de fábrica (turmas, alunos estrela e pareceres):
                  </p>
                  <button
                    type="button"
                    onClick={onResetData}
                    className="w-full py-3 px-4 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 font-bold text-xs sm:text-sm rounded-xl flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <span>Resetar Dados para o Padrão</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ==========================================
      // MODAL DE ALUNO ESTRELA ⭐ (CATEGORIAS E MOTIVO)
      // ==========================================
      function StarStudentModal({ student, teacherName, onClose, onSaveStar }) {
        const [isStar, setIsStar] = useState(student.isStar ?? true);
        const [category, setCategory] = useState(student.starCategory || 'academic');
        const [reason, setReason] = useState(student.starReason || 'Excelente raciocínio lógico e participação nas aulas.');

        const categories = [
          { id: 'academic', label: 'Desempenho Acadêmico', desc: 'Notas elevadas e raciocínio exemplar' },
          { id: 'attitude', label: 'Atitude & Cooperação', desc: 'Liderança positiva e respeito com todos' },
          { id: 'improvement', label: 'Superação & Evolução', desc: 'Grande salto no aprendizado e dedicação' },
          { id: 'creativity', label: 'Criatividade & Protagonismo', desc: 'Iniciativa em projetos e participação' },
        ];

        const handleSave = (e) => {
          e.preventDefault();
          onSaveStar(student.id, {
            isStar,
            starCategory: isStar ? category : undefined,
            starReason: isStar ? reason.trim() : undefined,
            starAddedBy: teacherName,
          });
        };

        return (
          <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden animate-in zoom-in-95">
              <div className="bg-slate-900 text-white p-6 flex items-start justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-amber-400/20 border border-amber-400/40 flex items-center justify-center text-amber-400">
                    <IconStar className="w-6 h-6 fill-amber-400 text-amber-400" filled />
                  </div>
                  <div>
                    <div className="text-xs text-amber-300 font-semibold">Reconhecimento Pedagógico</div>
                    <h3 className="text-lg font-bold text-white">{student.name}</h3>
                    <p className="text-xs text-slate-300">Número de Chamada: #{student.rollNumber}</p>
                  </div>
                </div>
                <button type="button" onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer">
                  <IconX className="w-5 h-5" />
                </button>
              </div>

              <form onSubmit={handleSave} className="p-6 space-y-4">
                <div className="flex items-center justify-between p-3 bg-amber-50 rounded-2xl border border-amber-200">
                  <span className="text-xs font-bold text-amber-950">Atribuir Reconhecimento Estrela ⭐</span>
                  <input
                    type="checkbox"
                    checked={isStar}
                    onChange={(e) => setIsStar(e.target.checked)}
                    className="w-5 h-5 rounded text-amber-600 focus:ring-amber-500"
                  />
                </div>

                {isStar && (
                  <>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-2">Categoria de Mérito:</label>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {categories.map((c) => (
                          <div
                            key={c.id}
                            onClick={() => setCategory(c.id)}
                            className={`p-3 rounded-xl border text-left cursor-pointer transition-colors ${
                              category === c.id ? 'bg-amber-100/70 border-amber-400 font-bold text-amber-950' : 'bg-slate-50 border-slate-200 text-slate-700'
                            }`}
                          >
                            <div className="text-xs">{c.label}</div>
                            <div className="text-[10px] text-slate-500 font-normal">{c.desc}</div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Motivo / Parecer Específico:</label>
                      <textarea
                        rows="3"
                        required
                        value={reason}
                        onChange={(e) => setReason(e.target.value)}
                        className="w-full text-xs sm:text-sm rounded-xl border border-slate-300 p-3 bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                  </>
                )}

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                  <button type="button" onClick={onClose} className="py-2.5 px-4 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl cursor-pointer">
                    Cancelar
                  </button>
                  <button type="submit" className="py-2.5 px-5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl shadow-xs cursor-pointer">
                    Salvar Destaque ⭐
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // ==========================================
      // MODAL DE VISUALIZAÇÃO DA FICHA DE CONSELHO
      // ==========================================
      function ReportModal({ report, questions, sections, schoolConfig, students, onClose }) {
        const starStudents = students.filter((s) => s.isStar);

        return (
          <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 sm:p-8 space-y-6">
              <div className="flex items-start justify-between pb-4 border-b border-slate-200">
                <div>
                  <div className="text-xs font-bold text-blue-700">{schoolConfig.documentTitle}</div>
                  <h2 className="text-lg sm:text-xl font-black text-slate-900">{report.className} — {report.subject}</h2>
                  <p className="text-xs text-slate-500 mt-0.5">Professor(a): <strong>{report.teacherName}</strong> · Data: {report.date}</p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={() => window.print()}
                    className="py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center gap-1 cursor-pointer"
                  >
                    <IconPrinter className="w-3.5 h-3.5" />
                    <span>Imprimir</span>
                  </button>
                  <button type="button" onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 cursor-pointer">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>
              </div>

              {/* Destaques Estrela da Turma */}
              {starStudents.length > 0 && (
                <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 space-y-2">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-amber-900 flex items-center gap-1">
                    <IconStar className="w-4 h-4 fill-amber-400 text-amber-500" filled />
                    <span>Alunos Estrela ⭐ Reconhecidos nesta Turma:</span>
                  </h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {starStudents.map((st) => (
                      <div key={st.id} className="p-2.5 rounded-xl bg-white border border-amber-200 text-xs">
                        <strong className="text-slate-900">#{st.rollNumber} {st.name}</strong>
                        <p className="text-[11px] text-amber-800 mt-0.5 italic">{st.starReason || 'Destaque acadêmico'}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Respostas por Seção */}
              <div className="space-y-6">
                {sections.map((sec) => {
                  const secQuestions = questions.filter((q) => q.sectionId === sec.id);
                  return (
                    <div key={sec.id} className="space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 border-b border-slate-200 pb-1">
                        {sec.title}
                      </h3>
                      {secQuestions.map((q) => (
                        <div key={q.id} className="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                          <div className="text-xs font-bold text-slate-800">{q.prompt}</div>
                          <p className="text-xs text-slate-700 whitespace-pre-wrap">
                            {report.answers[q.id] || <span className="text-slate-400 italic">(Sem preenchimento)</span>}
                          </p>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>

              {/* Assinaturas */}
              <div className="pt-6 border-t border-slate-200 grid grid-cols-2 gap-6 text-center text-xs text-slate-500">
                <div className="border-t border-slate-300 pt-2 font-medium">
                  {report.teacherName}
                  <div className="text-[10px] text-slate-400">Professor(a) Responsável</div>
                </div>
                <div className="border-t border-slate-300 pt-2 font-medium">
                  {schoolConfig.pedagogueName}
                  <div className="text-[10px] text-slate-400">Coordenação Pedagógica</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // MODAL DE NOTIFICAÇÕES
      // ==========================================
      function NotificationsModal({ notifications, currentUser, onClose, onMarkAsRead }) {
        return (
          <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl max-w-md w-full shadow-2xl p-6 space-y-4">
              <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                <div className="flex items-center gap-2">
                  <IconBell className="w-5 h-5 text-blue-600" />
                  <h3 className="text-base font-bold text-slate-900">Lembretes e Avisos</h3>
                </div>
                <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-600 cursor-pointer">
                  <IconX className="w-5 h-5" />
                </button>
              </div>

              <div className="space-y-2 max-h-72 overflow-y-auto">
                {notifications.length === 0 ? (
                  <p className="text-xs text-slate-400 text-center py-6">Nenhum aviso no momento.</p>
                ) : (
                  notifications.map((n) => (
                    <div
                      key={n.id}
                      onClick={() => onMarkAsRead(n.id)}
                      className={`p-3 rounded-2xl border transition-colors cursor-pointer ${
                        n.isRead ? 'bg-slate-50 border-slate-200' : 'bg-blue-50/50 border-blue-200'
                      }`}
                    >
                      <div className="flex items-center justify-between text-xs font-bold text-slate-900">
                        <span>{n.title}</span>
                        <span className="text-[10px] text-slate-400 font-normal">{n.date}</span>
                      </div>
                      <p className="text-xs text-slate-600 mt-1">{n.message}</p>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        );
      }

      // RENDERIZAÇÃO NO NAVEGADOR
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
